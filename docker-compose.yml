version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: flowem_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword2026!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowem_db}
      MYSQL_USER: ${MYSQL_USER:-flowem_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-FlowemSecret2026!}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowem_redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flowem_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-flowem_user}:${MYSQL_PASSWORD:-FlowemSecret2026!}@mysql:3306/${MYSQL_DATABASE:-flowem_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-flowem_prod_jwt_secret_brainovision_2026_xyz}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_DEFAULT_FROM_EMAIL: ${SES_DEFAULT_FROM_EMAIL:-notifications@mail.brainovision.in}
      APP_URL: ${APP_URL:-https://flowem.brainovision.in}
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: flowem_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro

volumes:
  mysql_data:
  redis_data:
  certbot_www:
