name: FlowEM Production Deployment Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-verify:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Frontend Compilation
        run: npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Prisma Client Generation
        run: |
          cd server
          npx prisma generate --schema=./prisma/schema.prisma

  deploy-to-hostinger-vps:
    name: Deploy to Hostinger VPS
    needs: build-and-verify
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            echo "[Deploy] Navigating to FlowEM deployment directory..."
            cd /opt/flowem || cd ~/flowem

            echo "[Deploy] Pulling latest updates from git repository..."
            git pull origin master

            echo "[Deploy] Rebuilding and launching Docker containers..."
            docker compose down --remove-orphans
            docker compose up -d --build

            echo "[Deploy] Applying Prisma database migrations to MySQL 8..."
            docker compose exec -T app npx prisma migrate deploy --schema=./prisma/schema.prisma

            echo "[Deploy] Waiting for healthcheck..."
            sleep 5
            curl -f http://127.0.0.1:5000/api/health || exit 1

            echo "[Deploy] Deployment sequence completed successfully."
