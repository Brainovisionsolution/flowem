<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowEM | Enterprise Bulk Email Automation Platform</title>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
      
      :root {
        font-family: "Cambria Math", "Cambria", "Lora", Georgia, serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }

      * {
        font-family: inherit;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background-color: #060913;
        color: #e2e8f0;

      /* Custom Morphism Scrollbar */
      ::-webkit-scrollbar {

        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 23, 42, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.35);
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.6);
      }

  <body class="bg-[#060913] text-slate-100 antialiased selection:bg-indigo-600/30 selection:text-indigo-200">
