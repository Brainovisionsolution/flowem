<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='20' height='16' x='2' y='4' rx='2'/><path d='m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowEM | Bulk Email Automation Platform</title>
    <meta name="description" content="FlowEM is a simple, high-speed bulk email automation platform. Send mass emails, build automated steps, and ensure your emails land in the inbox, not spam." />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap');
      
      :root {
        font-family: "Cambria Math", "Cambria", "Lora", Georgia, serif;
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }

      * {
        font-family: inherit;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        overflow-x: hidden;
      }

      /* Custom Light Morphism Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
        border: 1px solid #e2e8f0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-indigo-500/20 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
